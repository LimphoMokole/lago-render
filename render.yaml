databases:
  - name: lago-postgres
    databaseName: lago
    user: lago
    plan: free
    region: frankfurt

services:
  - type: keyvalue
    name: lago-redis
    plan: free
    region: frankfurt
    ipAllowList: []

  - type: web
    name: lago-api
    runtime: image
    plan: free
    region: frankfurt
    image:
      url: docker.io/getlago/api:v1.50.0
    dockerCommand: ./scripts/start.api.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lago-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lago-redis
          property: connectionString

      - key: LAGO_REDIS_CACHE_URL
        fromService:
          type: keyvalue
          name: lago-redis
          property: connectionString

      - key: SECRET_KEY_BASE
        generateValue: true

      - key: LAGO_RSA_PRIVATE_KEY
        sync: false

      - key: LAGO_ENCRYPTION_PRIMARY_KEY
        generateValue: true

      - key: LAGO_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true

      - key: LAGO_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true

      - key: RAILS_ENV
        value: production

      - key: RAILS_LOG_TO_STDOUT
        value: "true"

      - key: LAGO_API_URL
        value: https://lago-api.onrender.com

      - key: LAGO_FRONT_URL
        value: https://lago-front.onrender.com

      - key: LAGO_DISABLE_SIGNUP
        value: "false"

      - key: LAGO_USE_AWS_S3
        value: "false"

  - type: web
    name: lago-front
    runtime: image
    plan: free
    region: frankfurt
    image:
      url: docker.io/getlago/front:v1.50.0
    envVars:
      - key: LAGO_API_URL
        value: https://lago-api.onrender.com

      - key: LAGO_FRONT_URL
        value: https://lago-front.onrender.com